<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Blog">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
<link rel="icon" href="/admin/icon-192.png">
<title>Meu Blog | Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --amarelo:#F0B514; --amarelo-escuro:#D69E00; --preto:#1A1A1A;
    --fundo:#FFFFFF; --fundo-suave:#FFF6D9; --cartao:#FFFFFF;
    --texto:#1A1A1A; --suave:#666; --linha:#E3E3E3; --erro:#C0392B;
    --titulo:"Cinzel", Georgia, serif; --corpo:"Montserrat", "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --fundo:#121212; --fundo-suave:#1E1B12; --cartao:#1C1C1C; --texto:#F4F1E8; --suave:#AAA49A; --linha:#2E2E2E; --erro:#FF7B6B; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--corpo);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
  h1,h2{font-family:var(--titulo);margin:0;line-height:1.2}
  [hidden]{display:none !important}
  .tela{max-width:640px;margin:0 auto;padding:1rem 1rem 7rem}

  /* Botões */
  .btn{border:0;border-radius:28px;padding:.9rem 1.4rem;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
  .btn--amarelo{background:var(--amarelo);color:#1A1A1A}
  .btn--preto{background:var(--preto);color:#fff}
  @media (prefers-color-scheme: dark){.btn--preto{background:#F4F1E8;color:#1A1A1A}}
  .btn--contorno{background:transparent;border:1.5px solid var(--linha)}
  .btn--texto{background:none;padding:.5rem;font-weight:500;color:var(--suave)}
  .btn:disabled{opacity:.55}
  .btn--largo{width:100%}

  /* Login */
  #v-login{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .logo-login{width:72px;height:72px;border-radius:20px;background:var(--amarelo);color:#1A1A1A;font-family:var(--titulo);font-size:2.4rem;display:grid;place-items:center;margin-bottom:1.5rem}
  #v-login h1{font-size:2rem;margin-bottom:.4rem}
  #v-login p{color:var(--suave);margin:0 0 2rem}
  .campo{display:block;margin-bottom:1.1rem}
  .campo span{display:block;font-weight:700;font-size:.9rem;margin-bottom:.35rem}
  .campo small{display:block;color:var(--suave);font-size:.8rem;margin-top:.3rem}
  .entrada{width:100%;padding:.9rem 1rem;border:1.5px solid var(--linha);border-radius:12px;background:var(--cartao);font-size:1rem}
  .entrada:focus{border-color:var(--amarelo);outline:none}
  textarea.entrada{resize:vertical;min-height:84px}
  .erro{color:var(--erro);font-size:.9rem;min-height:1.3rem;margin:.25rem 0 .75rem}

  /* Lista */
  .cabecalho{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0 1.25rem}
  .cabecalho h1{font-size:1.5rem}
  .nova{width:100%;padding:1.1rem;font-size:1.1rem;margin-bottom:1.5rem}
  .abas{display:flex;gap:.4rem;background:var(--fundo-suave);padding:.3rem;border-radius:999px;margin-bottom:1.25rem}
  .aba{flex:1;border:0;background:none;padding:.6rem .4rem;border-radius:999px;font-weight:500;font-size:.88rem}
  .aba[aria-selected="true"]{background:var(--preto);color:#fff}
  @media (prefers-color-scheme: dark){.aba[aria-selected="true"]{background:var(--amarelo);color:#1A1A1A}}
  .item{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:.7rem;margin-bottom:.75rem}
  .item .miniatura{width:68px;height:68px;border-radius:12px;object-fit:cover;flex:none;background:var(--amarelo)}
  .item .miniatura--vazia{display:grid;place-items:center;font-family:var(--titulo);font-size:1.6rem;color:#1A1A1A}
  .item strong{display:block;font-size:1rem;line-height:1.3;margin-bottom:.2rem}
  .item span{font-size:.82rem;color:var(--suave)}
  .vazio{text-align:center;color:var(--suave);padding:2.5rem 1rem}

  /* Editor */
  .barra-topo{display:flex;align-items:center;justify-content:space-between;padding:.25rem 0 1rem}
  .capa{position:relative;border:2px dashed var(--linha);border-radius:16px;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;background:var(--fundo-suave);margin-bottom:1.25rem;width:100%;padding:0}
  .capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .capa .rotulo{position:relative;background:rgba(26,26,26,.75);color:#fff;padding:.5rem 1rem;border-radius:999px;font-weight:500;font-size:.9rem}
  .titulo-post{font-family:var(--titulo);font-size:1.5rem;font-weight:700;border:0;border-bottom:2px solid var(--linha);border-radius:0;padding:.5rem 0;background:none;width:100%;margin-bottom:1.25rem}
  .titulo-post:focus{outline:none;border-color:var(--amarelo)}
  .ferramentas{position:sticky;top:0;z-index:5;display:flex;gap:.35rem;overflow-x:auto;background:var(--fundo);padding:.5rem 0;border-bottom:1px solid var(--linha)}
  .ferramentas button{flex:none;min-width:44px;height:44px;border:1px solid var(--linha);border-radius:10px;background:var(--cartao);font-weight:700;padding:0 .7rem}
  .texto{min-height:45vh;padding:1rem 0 2rem;outline:none;font-size:1.05rem;line-height:1.7}
  .texto:empty::before{content:attr(data-placeholder);color:var(--suave)}
  .texto h2{font-size:1.35rem;margin:1.2rem 0 .5rem}
  .texto img{max-width:100%;height:auto;border-radius:12px;display:block;margin:1rem 0}
  .texto blockquote{margin:1rem 0;padding-left:1rem;border-left:4px solid var(--amarelo);font-style:italic}
  .texto a{color:var(--amarelo-escuro)}
  .detalhes{border-top:1px solid var(--linha);padding-top:1.25rem}
  .agendar{display:flex;align-items:center;gap:.6rem;font-weight:700;margin:.25rem 0 .75rem}
  .agendar input[type=checkbox]{width:22px;height:22px;accent-color:var(--amarelo)}
  .acoes{position:fixed;left:0;right:0;bottom:0;background:var(--fundo);border-top:1px solid var(--linha);padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));display:flex;gap:.6rem;z-index:10}
  .acoes .btn{flex:1;padding:.95rem .5rem}
  .perigo{color:var(--erro);background:none;border:0;font-weight:500;padding:1rem 0;margin-top:1rem}
  .status-chip{font-size:.75rem;font-weight:700;padding:.25rem .7rem;border-radius:999px;background:var(--fundo-suave)}
  .aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6rem + env(safe-area-inset-bottom,0px));background:var(--preto);color:#fff;padding:.8rem 1.2rem;border-radius:999px;font-weight:500;z-index:30;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .carregando{text-align:center;color:var(--suave);padding:3rem 0}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="v-login" class="tela" hidden>
  <div class="logo-login" aria-hidden="true">G</div>
  <h1>Olá, Gessica!</h1>
  <p>Entre para escrever suas histórias.</p>
  <form id="form-login" novalidate>
    <label class="campo"><span>E-mail</span><input class="entrada" type="email" id="login-email" autocomplete="username" required></label>
    <label class="campo"><span>Senha</span><input class="entrada" type="password" id="login-senha" autocomplete="current-password" required></label>
    <p class="erro" id="login-erro" role="alert"></p>
    <button class="btn btn--preto btn--largo" type="submit" id="btn-entrar">Entrar</button>
  </form>
</section>

<!-- LISTA -->
<section id="v-lista" class="tela" hidden>
  <div class="cabecalho">
    <h1>Minhas histórias</h1>
    <button class="btn btn--texto" id="btn-sair">Sair</button>
  </div>
  <button class="btn btn--amarelo nova" id="btn-nova">+ Nova história</button>
  <div class="abas" role="tablist">
    <button class="aba" role="tab" data-aba="rascunhos" aria-selected="true">Rascunhos</button>
    <button class="aba" role="tab" data-aba="agendados" aria-selected="false">Agendados</button>
    <button class="aba" role="tab" data-aba="publicados" aria-selected="false">Publicados</button>
  </div>
  <div id="lista"></div>
</section>

<!-- EDITOR -->
<section id="v-editor" class="tela" hidden>
  <div class="barra-topo">
    <button class="btn btn--texto" id="btn-voltar">‹ Voltar</button>
    <span class="status-chip" id="status-chip">Rascunho</span>
  </div>

  <button type="button" class="capa" id="capa">
    <img id="capa-img" alt="" hidden>
    <span class="rotulo" id="capa-rotulo">+ Foto de capa</span>
  </button>
  <input type="file" id="arquivo-capa" accept="image/*" hidden>

  <input class="titulo-post" id="titulo" placeholder="Título da história" maxlength="120" aria-label="Título">

  <div class="ferramentas" role="toolbar" aria-label="Formatação">
    <button type="button" data-cmd="bold" aria-label="Negrito"><b>B</b></button>
    <button type="button" data-cmd="italic" aria-label="Itálico"><i>I</i></button>
    <button type="button" data-cmd="h2" aria-label="Subtítulo">T</button>
    <button type="button" data-cmd="lista" aria-label="Lista">• Lista</button>
    <button type="button" data-cmd="citacao" aria-label="Citação">“ ”</button>
    <button type="button" data-cmd="link" aria-label="Link">Link</button>
    <button type="button" data-cmd="foto" aria-label="Inserir foto">Foto</button>
  </div>
  <input type="file" id="arquivo-foto" accept="image/*" hidden>
  <div class="texto" id="texto" contenteditable="true" data-placeholder="Escreva sua história aqui..." aria-label="Texto da história"></div>

  <div class="detalhes">
    <label class="campo"><span>Resumo</span>
      <textarea class="entrada" id="resumo" maxlength="200" placeholder="Uma ou duas frases que aparecem no blog e quando o link é compartilhado."></textarea>
    </label>
    <label class="campo"><span>Categorias</span>
      <input class="entrada" id="categorias" placeholder="Ex.: Sabores, São Paulo">
      <small>Até 3, separadas por vírgula.</small>
    </label>
    <label class="agendar"><input type="checkbox" id="agendar-check"> Publicar em outra data</label>
    <label class="campo" id="agendar-campo" hidden><span>Dia e hora</span>
      <input class="entrada" type="datetime-local" id="agendar-data">
    </label>
    <a class="btn btn--contorno btn--largo" id="btn-ver" target="_blank" rel="noopener" hidden>Ver no site</a>
    <button class="perigo" id="btn-excluir" hidden>Excluir esta história</button>
  </div>

  <div class="acoes">
    <button class="btn btn--contorno" id="btn-rascunho">Salvar rascunho</button>
    <button class="btn btn--amarelo" id="btn-publicar">Publicar</button>
  </div>
</section>

<div class="carregando" id="carregando">Carregando...</div>
<div class="aviso" id="aviso" role="status" hidden></div>

<script src="/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(BLOG_CONFIG.supabaseUrl, BLOG_CONFIG.supabaseKey);
const $ = (id) => document.getElementById(id);
const telas = ['v-login', 'v-lista', 'v-editor'];
let posts = [];
let abaAtual = 'rascunhos';
let atual = null;       // post aberto no editor
let alterado = false;   // há mudanças não salvas
let ultimoRange = null; // seleção dentro do texto

/* ---------- utilidades ---------- */
function mostrar(tela){
  $('carregando').hidden = true;
  telas.forEach(t => $(t).hidden = t !== tela);
  window.scrollTo(0, 0);
}
function aviso(msg){
  const el = $('aviso');
  el.textContent = msg; el.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(() => el.hidden = true, 3200);
}
function slugify(txt){
  return (txt || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70) || 'historia';
}
const aleatorio = () => Math.random().toString(36).slice(2, 6);
function dataBR(iso, comHora){
  const d = new Date(iso);
  return comHora
    ? d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('pt-BR');
}
function paraInputLocal(iso){
  const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
function classificar(p){
  if (p.status === 'draft') return 'rascunhos';
  return new Date(p.published_at) > new Date() ? 'agendados' : 'publicados';
}

/* Reduz a foto no próprio celular antes de enviar (fotos de celular são enormes) */
function comprimir(arquivo, max = 1600){
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      const esc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : falha(new Error('foto')), 'image/jpeg', 0.82);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => falha(new Error('foto'));
    img.src = URL.createObjectURL(arquivo);
  });
}
async function enviarFoto(arquivo, pasta){
  const blob = await comprimir(arquivo);
  const caminho = `${pasta}/${Date.now()}-${aleatorio()}.jpg`;
  const { error } = await sb.storage.from('imagens').upload(caminho, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return sb.storage.from('imagens').getPublicUrl(caminho).data.publicUrl;
}

/* ---------- login ---------- */
$('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('login-erro').textContent = '';
  $('btn-entrar').disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: $('login-email').value.trim(), password: $('login-senha').value
  });
  $('btn-entrar').disabled = false;
  if (error) { $('login-erro').textContent = 'E-mail ou senha incorretos.'; return; }
  abrirLista();
});
$('btn-sair').addEventListener('click', async () => { await sb.auth.signOut(); mostrar('v-login'); });

/* ---------- lista ---------- */
async function abrirLista(){
  mostrar('v-lista');
  $('lista').innerHTML = '<p class="carregando">Carregando...</p>';
  const { data, error } = await sb.from('posts')
    .select('id,title,cover_url,status,published_at,updated_at,slug')
    .order('updated_at', { ascending: false });
  if (error) { $('lista').innerHTML = '<p class="vazio">Não deu para carregar. Verifique a internet.</p>'; return; }
  posts = data;
  desenharLista();
}
function desenharLista(){
  document.querySelectorAll('.aba').forEach(b => {
    const qtd = posts.filter(p => classificar(p) === b.dataset.aba).length;
    b.setAttribute('aria-selected', b.dataset.aba === abaAtual);
    b.textContent = b.dataset.aba[0].toUpperCase() + b.dataset.aba.slice(1) + (qtd ? ` (${qtd})` : '');
  });
  const lista = posts.filter(p => classificar(p) === abaAtual);
  const box = $('lista'); box.innerHTML = '';
  if (!lista.length) {
    const msgs = { rascunhos: 'Nenhum rascunho por aqui.', agendados: 'Nada agendado.', publicados: 'Nenhuma história publicada ainda.' };
    box.innerHTML = `<p class="vazio">${msgs[abaAtual]}</p>`; return;
  }
  lista.forEach(p => {
    const b = document.createElement('button');
    b.className = 'item';
    let mini;
    if (p.cover_url) { mini = document.createElement('img'); mini.src = p.cover_url; mini.alt = ''; mini.className = 'miniatura'; }
    else { mini = document.createElement('div'); mini.className = 'miniatura miniatura--vazia'; mini.textContent = (p.title || 'G')[0].toUpperCase(); }
    const txt = document.createElement('div');
    const t = document.createElement('strong'); t.textContent = p.title || 'Sem título';
    const s = document.createElement('span');
    const tipo = classificar(p);
    s.textContent = tipo === 'rascunhos' ? `Editado em ${dataBR(p.updated_at)}`
      : tipo === 'agendados' ? `Sai em ${dataBR(p.published_at, true)}` : `Publicado em ${dataBR(p.published_at)}`;
    txt.append(t, s); b.append(mini, txt);
    b.addEventListener('click', () => abrirEditor(p.id));
    box.append(b);
  });
}
document.querySelectorAll('.aba').forEach(b => b.addEventListener('click', () => { abaAtual = b.dataset.aba; desenharLista(); }));
$('btn-nova').addEventListener('click', () => abrirEditor(null));

/* ---------- editor ---------- */
async function abrirEditor(id){
  if (id) {
    const { data, error } = await sb.from('posts').select('*').eq('id', id).single();
    if (error) { aviso('Não deu para abrir esta história.'); return; }
    atual = data;
  } else {
    atual = { title: '', summary: '', cover_url: null, categories: [], content_html: '', status: 'draft', published_at: null, slug: null };
  }
  $('titulo').value = atual.title;
  $('resumo').value = atual.summary;
  $('categorias').value = (atual.categories || []).join(', ');
  $('texto').innerHTML = atual.content_html;
  definirCapa(atual.cover_url);
  const agendado = atual.status === 'published' && new Date(atual.published_at) > new Date();
  $('agendar-check').checked = agendado;
  $('agendar-campo').hidden = !agendado;
  $('agendar-data').value = agendado ? paraInputLocal(atual.published_at) : '';
  atualizarBotoes();
  alterado = false;
  mostrar('v-editor');
}
function definirCapa(url){
  atual.cover_url = url;
  $('capa-img').hidden = !url;
  if (url) $('capa-img').src = url;
  $('capa-rotulo').textContent = url ? 'Trocar foto' : '+ Foto de capa';
}
function atualizarBotoes(){
  const publicado = atual.status === 'published';
  const tipo = atual.id ? classificar(atual) : 'rascunhos';
  $('status-chip').textContent = { rascunhos: 'Rascunho', agendados: 'Agendado', publicados: 'Publicado' }[tipo];
  $('btn-rascunho').textContent = publicado ? 'Despublicar' : 'Salvar rascunho';
  $('btn-publicar').textContent = $('agendar-check').checked ? 'Agendar' : (tipo === 'publicados' ? 'Atualizar' : 'Publicar');
  $('btn-excluir').hidden = !atual.id;
  $('btn-ver').hidden = !atual.slug;
  if (atual.slug) $('btn-ver').href = `/post.html?slug=${encodeURIComponent(atual.slug)}`;
}
['titulo', 'resumo', 'categorias', 'agendar-data'].forEach(id => $(id).addEventListener('input', () => alterado = true));
$('texto').addEventListener('input', () => alterado = true);
$('agendar-check').addEventListener('change', () => {
  $('agendar-campo').hidden = !$('agendar-check').checked;
  if ($('agendar-check').checked && !$('agendar-data').value) {
    const amanha = new Date(Date.now() + 864e5); amanha.setHours(9, 0, 0, 0);
    $('agendar-data').value = paraInputLocal(amanha.toISOString());
  }
  alterado = true; atualizarBotoes();
});
$('btn-voltar').addEventListener('click', () => {
  if (alterado && !confirm('Sair sem salvar as mudanças?')) return;
  alterado = false; abrirLista();
});
window.addEventListener('beforeunload', (e) => { if (alterado) { e.preventDefault(); e.returnValue = ''; } });

/* Capa */
$('capa').addEventListener('click', () => $('arquivo-capa').click());
$('arquivo-capa').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  $('capa-rotulo').textContent = 'Enviando foto...';
  try { definirCapa(await enviarFoto(f, 'capas')); alterado = true; }
  catch { aviso('Não deu para enviar a foto.'); definirCapa(atual.cover_url); }
});

/* Formatação do texto */
document.addEventListener('selectionchange', () => {
  const s = window.getSelection();
  if (s.rangeCount && $('texto').contains(s.anchorNode)) ultimoRange = s.getRangeAt(0).cloneRange();
});
function restaurarSelecao(){
  $('texto').focus();
  if (ultimoRange) { const s = window.getSelection(); s.removeAllRanges(); s.addRange(ultimoRange); }
}
document.querySelectorAll('.ferramentas button').forEach(b => {
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', () => {
    const cmd = b.dataset.cmd;
    if (cmd === 'foto') { $('arquivo-foto').click(); return; }
    restaurarSelecao();
    if (cmd === 'bold' || cmd === 'italic') document.execCommand(cmd);
    else if (cmd === 'h2') document.execCommand('formatBlock', false, document.queryCommandValue('formatBlock') === 'h2' ? 'p' : 'h2');
    else if (cmd === 'lista') document.execCommand('insertUnorderedList');
    else if (cmd === 'citacao') document.execCommand('formatBlock', false, document.queryCommandValue('formatBlock') === 'blockquote' ? 'p' : 'blockquote');
    else if (cmd === 'link') {
      let url = prompt('Cole o link (ex.: instagram.com/lugar)');
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      restaurarSelecao();
      if (window.getSelection().isCollapsed) document.execCommand('insertHTML', false, `<a href="${url.replace(/"/g, '&quot;')}">${url.replace(/</g, '&lt;')}</a>`);
      else document.execCommand('createLink', false, url);
    }
    alterado = true;
  });
});
$('arquivo-foto').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  aviso('Enviando foto...');
  try {
    const url = await enviarFoto(f, 'textos');
    restaurarSelecao();
    document.execCommand('insertHTML', false, `<img src="${url}" alt=""><p><br></p>`);
    alterado = true; aviso('Foto inserida!');
  } catch { aviso('Não deu para enviar a foto.'); }
});
/* Colar só o texto, sem a formatação de outros sites */
$('texto').addEventListener('paste', (e) => {
  e.preventDefault();
  document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});

/* Salvar */
async function salvar(modo){
  const titulo = $('titulo').value.trim();
  const html = $('texto').innerHTML.trim();
  const textoPuro = $('texto').innerText.trim();
  if (modo !== 'rascunho' && (!titulo || !textoPuro)) { aviso('Coloque um título e o texto antes de publicar.'); return; }

  const linha = {
    title: titulo,
    summary: $('resumo').value.trim(),
    cover_url: atual.cover_url,
    categories: $('categorias').value.split(',').map(c => c.trim()).filter(Boolean).slice(0, 3),
    content_html: html,
    reading_minutes: Math.max(1, Math.round(textoPuro.split(/\s+/).length / 200))
  };

  if (modo === 'rascunho') {
    if (atual.status === 'published' && !confirm('Tirar esta história do site e voltar para rascunho?')) return;
    linha.status = 'draft'; linha.published_at = null;
  } else if ($('agendar-check').checked) {
    const quando = new Date($('agendar-data').value);
    if (isNaN(quando) || quando <= new Date()) { aviso('Escolha uma data e hora no futuro.'); return; }
    linha.status = 'published'; linha.published_at = quando.toISOString();
  } else {
    linha.status = 'published';
    const jaNoAr = atual.status === 'published' && new Date(atual.published_at) <= new Date();
    linha.published_at = jaNoAr ? atual.published_at : new Date().toISOString();
  }
  // O endereço do post acompanha o título enquanto ainda não foi publicado
  if (!atual.slug || atual.status === 'draft') linha.slug = slugify(titulo || 'rascunho-' + aleatorio());

  ['btn-rascunho', 'btn-publicar'].forEach(id => $(id).disabled = true);
  let res;
  for (let tentativa = 0; tentativa < 3; tentativa++) {
    res = atual.id
      ? await sb.from('posts').update(linha).eq('id', atual.id).select().single()
      : await sb.from('posts').insert(linha).select().single();
    if (res.error && res.error.code === '23505' && linha.slug) { linha.slug = slugify(titulo) + '-' + aleatorio(); continue; }
    break;
  }
  ['btn-rascunho', 'btn-publicar'].forEach(id => $(id).disabled = false);
  if (res.error) { aviso('Não deu para salvar. Verifique a internet.'); return; }

  atual = res.data; alterado = false; atualizarBotoes();
  if (modo === 'rascunho') aviso('Rascunho salvo!');
  else if (classificar(atual) === 'agendados') { aviso(`Agendado para ${dataBR(atual.published_at, true)}`); abaAtual = 'agendados'; abrirLista(); }
  else { aviso('Publicado! Já está no site.'); abaAtual = 'publicados'; abrirLista(); }
}
$('btn-rascunho').addEventListener('click', () => salvar('rascunho'));
$('btn-publicar').addEventListener('click', () => salvar('publicar'));
$('btn-excluir').addEventListener('click', async () => {
  if (!confirm('Excluir esta história? Não dá para desfazer.')) return;
  const { error } = await sb.from('posts').delete().eq('id', atual.id);
  if (error) { aviso('Não deu para excluir.'); return; }
  alterado = false; aviso('História excluída.'); abrirLista();
});

/* ---------- início ---------- */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  session ? abrirLista() : mostrar('v-login');
})();
</script>
